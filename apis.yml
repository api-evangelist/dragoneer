aid: dragoneer
name: Dragoneer Investment Group
description: >-
  Dragoneer Investment Group is a San Francisco-based growth-oriented investment firm founded in 2012 by
  Marc Stad, a former TPG Capital and McKinsey investor. Dragoneer deploys long-duration capital across both
  public and private markets, concentrating on late-stage, high-growth technology companies rather than
  early-stage seed bets. In private markets it runs growth-equity funds that back category-leading private
  technology companies; in public markets it manages long-only strategy funds invested in listed technology
  businesses. Its capital comes from institutional limited partners including endowments, foundations,
  sovereign wealth funds, and family offices, and the firm is known for a patient, concentrated,
  founder-friendly approach that avoids traditional turnover. Dragoneer manages roughly $22B-$30B+ in assets
  under management (2024-2025), with sector focus spanning enterprise software, fintech and financial
  services, consumer internet, and artificial intelligence. The firm also sponsored a series of Dragoneer
  Growth Opportunities SPACs (which took CCC Intelligent Solutions and Cvent public) and is headquartered at
  the Letterman Digital Arts Center in San Francisco. Notable investments include Uber, Airbnb, Snowflake,
  Databricks, Slack, Spotify, DoorDash, Nubank, OpenAI, and Anthropic.
